databases:
  - name: pathtoskill-db
    plan: free
    databaseName: edtech
    user: pathtoskill

services:
  - type: web
    name: pathtoskill-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run db:migrate && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pathtoskill-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://pathtoskill.onrender.com
      - key: RESET_TOKEN_EXPIRES_MINUTES
        value: 30

  - type: web
    name: pathtoskill
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://pathtoskill-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
