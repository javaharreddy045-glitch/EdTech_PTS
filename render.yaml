databases:
  - name: pathtoskill-db
    plan: free
    databaseName: edtech
    user: pathtoskill

services:
  - type: web
    name: pathtoskill-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pathtoskill-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: RESET_TOKEN_EXPIRES_MINUTES
        value: 30
      - key: CLIENT_ORIGIN
        sync: false # set to the frontend Static Site's URL after it's created
      - key: FRONTEND_URL
        sync: false # same value as CLIENT_ORIGIN - used to build the emailed reset link
      - key: RESEND_API_KEY
        sync: false # from https://resend.com - leave unset to fall back to dev-mode token logging
      - key: MAIL_FROM
        value: "PathToSkill <onboarding@resend.dev>"

  - type: web
    name: pathtoskill
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # set to https://<pathtoskill-api-url>/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
