databases:
  - name: pathtoskill-db
    plan: free
    databaseName: edtech
    user: pathtoskill

services:
  # Single combined service: Express serves both the API (under /api) and the built
  # React app. This keeps the deployment to 2 Render services total (this + the database),
  # which fits accounts on the free plan's service limit. See README for the alternative
  # split (separate static site) deployment if you have room for a 3rd service.
  - type: web
    name: pathtoskill
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend && cp -r frontend/dist backend/public
    startCommand: npm run db:migrate --prefix backend && npm start --prefix backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pathtoskill-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: RESET_TOKEN_EXPIRES_MINUTES
        value: 30
      - key: VITE_API_BASE_URL
        value: /api
